spring:
  application:
    name: cinema
  profiles:
    active: dev
  messages:
    basename: messages
    encoding: UTF-8
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
  api-docs:
    path: /api-docs
  packages-to-scan: com.cinema.controller

app:
  settings:
    title: Cinema API
    contact-email: cinema-api@example.com
    pagination-limit: 20
    external-service-url: https://api.themoviedb.org/3
    catalog-public-enabled: true

logging:
  file:
    name: logs/app.log
